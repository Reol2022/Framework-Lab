expected_result: 声明版本的 pnpm 可用，冻结安装、lint、build 和限时示例冒烟均完成，并保留可追溯证据。
actual_result: 旧 commit 的 Run 003 因 ERR_PNPM_OUTDATED_LOCKFILE 失败。切换到 faf42ba 后，Run 006 在 Node v24.18.0 与 pnpm 10.26.1 下完成 frozen install；lint 以 30 errors、11 warnings 退出 1；build 进入 @ncom/all 和 @ncom/theme 后因 packages/theme/scripts/build.mjs 缺失报 MODULE_NOT_FOUND。Run 007 的 example 服务器成功监听 3000，首页和抽查静态资源返回 200，但应用入口因 @ncom/all/theme/deepblue alias 目标不存在而返回 500；用户浏览器显示 Vite import-analysis overlay。typecheck 与 test 为 Not Provided。已跟踪文件保持不变，工作树保留安装生成的 node_modules。
failure_category: framework-bug
